<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RED ROOM | Guest Room</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/room.css"></head><body class="roompage">
<header class="roomhead"><a class="brand" href="/">🔴 RED ROOM</a><div><b id="roomlabel">ROOM</b><span class="status" id="status">Connecting...</span><button class="btn ghost small" id="peoplebtn">Guests <b id="count">0</b></button></div></header>
<main class="layout"><section class="chat"><div class="banner"><div><div class="eyebrow">PRIVATE GUEST ROOM</div><h2 id="roomtitle">Room</h2></div><div class="keybadge">🔑 <span id="keydisplay">PRIVATE KEY</span></div></div><div class="messages" id="messages"></div><div class="typing" id="typing"></div><div class="composer"><input type="file" id="media" hidden accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><button class="attach" id="attach">＋</button><textarea id="input" maxlength="1200" rows="1" placeholder="Write something private..."></textarea><button class="send" id="send">➤</button><small>Enter to send • Shift + Enter for a new line • Media up to 7 MB</small></div></section><aside class="people" id="people"><div class="panelhead"><div><div class="eyebrow">INSIDE THE ROOM</div><h3>Guests</h3></div><button class="icon" id="closepeople">×</button></div><div id="participants"></div><div class="privacy">🔒 <b>Private room</b><span>Guests are represented by anonymous room names.</span></div></aside></main><div class="toast" id="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/js/room.js"></script></body></html>
